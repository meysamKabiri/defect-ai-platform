services:
  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/defect-ai-uploads

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/defect-ai-uploads

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: defect_ai
      MYSQL_USER: root
      MYSQL_PASSWORD: Hello1234#
      MYSQL_ROOT_PASSWORD: defect_ai_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u defect_ai -pHello1234# --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
  redis_data:
  upload_data:
